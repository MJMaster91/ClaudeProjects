<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangman</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 4px;
      color: #e94560;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .game {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      max-width: 600px;
    }

    svg#gallows {
      background: #16213e;
      border-radius: 12px;
      padding: 10px;
    }

    .gallows-line { stroke: #a8b2d8; stroke-width: 4; stroke-linecap: round; fill: none; }

    #status {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 1px;
      min-height: 28px;
      color: #a8b2d8;
    }
    #status.win  { color: #64ffda; }
    #status.lose { color: #e94560; }

    #word-display {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .letter-slot {
      width: 32px;
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      border-bottom: 3px solid #a8b2d8;
      padding-bottom: 4px;
      text-transform: uppercase;
      color: #64ffda;
      min-height: 42px;
    }

    #keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 480px;
    }

    .key {
      width: 42px;
      height: 42px;
      border: 2px solid #a8b2d8;
      border-radius: 8px;
      background: #16213e;
      color: #eee;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .key:hover:not(:disabled) {
      background: #e94560;
      border-color: #e94560;
      transform: translateY(-2px);
    }

    .key:disabled {
      opacity: 0.25;
      cursor: default;
      transform: none;
    }

    .key.wrong  { border-color: #e94560; color: #e94560; }
    .key.right  { border-color: #64ffda; color: #64ffda; }

    #wrong-count {
      font-size: 0.9rem;
      color: #a8b2d8;
    }
    #wrong-count span { color: #e94560; font-weight: 700; }

    #hint {
      font-size: 0.85rem;
      color: #8892b0;
      font-style: italic;
    }

    #play-again {
      display: none;
      padding: 12px 32px;
      background: #e94560;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: background 0.15s, transform 0.1s;
    }

    #play-again:hover {
      background: #c73652;
      transform: translateY(-2px);
    }

    #answer-reveal {
      font-size: 0.9rem;
      color: #8892b0;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <h1>Hangman</h1>

  <div class="game">
    <svg id="gallows" width="220" height="220" viewBox="0 0 220 220">
      <!-- Gallows structure -->
      <line class="gallows-line" x1="20"  y1="210" x2="200" y2="210"/>
      <line class="gallows-line" x1="60"  y1="210" x2="60"  y2="10"/>
      <line class="gallows-line" x1="60"  y1="10"  x2="140" y2="10"/>
      <line class="gallows-line" x1="140" y1="10"  x2="140" y2="40"/>

      <!-- ① HEAD -->
      <g id="h-head" style="display:none">
        <!-- Back hair (behind face) -->
        <path style="fill:#2C1503;stroke:none"
          d="M124,51 Q122,35 140,33 Q158,35 156,51 Q162,79 157,97 Q148,108 140,109 Q132,108 123,97 Q118,79 124,51Z"/>
        <!-- Face -->
        <ellipse style="fill:#F8C5A0;stroke:#D9A07A;stroke-width:0.5" cx="140" cy="60" rx="15" ry="19"/>
        <!-- Front hair with part -->
        <path style="fill:#2C1503;stroke:none"
          d="M124,51 Q127,38 140,36 Q153,38 156,51 Q153,44 148,41 Q144,48 140,46 Q136,48 132,41 Q127,44 124,51Z"/>
        <!-- Left eyebrow -->
        <path style="fill:#2C1503;stroke:none" d="M128,52 Q131,49.5 135,51 Q132,51.5 128,52Z"/>
        <!-- Right eyebrow -->
        <path style="fill:#2C1503;stroke:none" d="M145,51 Q149,49.5 152,52 Q148,51.5 145,51Z"/>
        <!-- Left eye -->
        <g id="h-eye-l">
          <ellipse style="fill:#F0EAE2;stroke:#C09070;stroke-width:0.4" cx="133" cy="57.5" rx="4.2" ry="2.9"/>
          <circle  style="fill:#4A2810" cx="133" cy="57.5" r="2"/>
          <circle  style="fill:#0A0200" cx="133" cy="57.5" r="1.2"/>
          <circle  style="fill:white;stroke:none" cx="133.8" cy="56.8" r="0.6"/>
          <path    style="fill:none;stroke:#0A0200;stroke-width:1.2;stroke-linecap:round" d="M129,55.2 Q133,53.5 137,55.2"/>
        </g>
        <!-- Right eye -->
        <g id="h-eye-r">
          <ellipse style="fill:#F0EAE2;stroke:#C09070;stroke-width:0.4" cx="147" cy="57.5" rx="4.2" ry="2.9"/>
          <circle  style="fill:#4A2810" cx="147" cy="57.5" r="2"/>
          <circle  style="fill:#0A0200" cx="147" cy="57.5" r="1.2"/>
          <circle  style="fill:white;stroke:none" cx="147.8" cy="56.8" r="0.6"/>
          <path    style="fill:none;stroke:#0A0200;stroke-width:1.2;stroke-linecap:round" d="M143,55.2 Q147,53.5 151,55.2"/>
        </g>
        <!-- Nose (subtle shadow) -->
        <path style="fill:#E0A072;stroke:none"
          d="M139,63 Q137.5,67.5 139,69.5 Q140,70.5 141,69.5 Q142.5,67.5 141,63 Q140.5,64.5 140,64.5 Q139.5,64.5 139,63Z"/>
        <!-- Mouth -->
        <g id="h-mouth">
          <path style="fill:#B83050;stroke:none"
            d="M134,71.5 Q136.5,69 139,70.5 Q140,69.5 141,70.5 Q143.5,69 146,71.5 Q143,73 140,72.5 Q137,73 134,71.5Z"/>
          <path style="fill:#CC4868;stroke:none"
            d="M134,71.5 Q137,76 140,76 Q143,76 146,71.5 Q143,73 140,72.5 Q137,73 134,71.5Z"/>
        </g>
        <!-- Blush -->
        <ellipse style="fill:#F09090;stroke:none;opacity:0.27" cx="126.5" cy="63" rx="4.5" ry="3"/>
        <ellipse style="fill:#F09090;stroke:none;opacity:0.27" cx="153.5" cy="63" rx="4.5" ry="3"/>
        <!-- Neck -->
        <path style="fill:#F8C5A0;stroke:none" d="M136,79 Q135,85 136,89 L144,89 Q145,85 144,79Z"/>
        <!-- Long side hair -->
        <path style="fill:#2C1503;stroke:none" d="M123,57 Q114,81 116,101 Q119,108 123,98 Q121,85 125,68Z"/>
        <path style="fill:#2C1503;stroke:none" d="M157,57 Q166,81 164,101 Q161,108 157,98 Q159,85 155,68Z"/>
        <!-- GAME-END OVERLAYS (hidden during play) -->
        <g id="h-eyes-x" style="display:none">
          <line x1="129" y1="54.6" x2="137" y2="60.4" style="stroke:#FF1E3C;stroke-width:2.2;stroke-linecap:round"/>
          <line x1="137" y1="54.6" x2="129" y2="60.4" style="stroke:#FF1E3C;stroke-width:2.2;stroke-linecap:round"/>
          <line x1="143" y1="54.6" x2="151" y2="60.4" style="stroke:#FF1E3C;stroke-width:2.2;stroke-linecap:round"/>
          <line x1="151" y1="54.6" x2="143" y2="60.4" style="stroke:#FF1E3C;stroke-width:2.2;stroke-linecap:round"/>
        </g>
        <path id="h-win-smile" style="display:none;fill:#CC4868;stroke:none"
          d="M133,71.5 Q140,79.5 147,71.5 Q143,75 140,75 Q137,75 133,71.5Z"/>
      </g>

      <!-- ② BODY -->
      <g id="h-body" style="display:none">
        <!-- Neck skin bridge -->
        <rect style="fill:#F8C5A0;stroke:none" x="135" y="88" width="10" height="4"/>
        <!-- Blouse (deep pink, fitted) -->
        <path style="fill:#C23B6E;stroke:#A03060;stroke-width:0.5"
          d="M137,91 Q124,90 114,98 L113,148 Q116,154 119,156 L161,156 Q164,154 167,148 L166,98 Q156,90 143,91 Q141.5,89 140,89 Q138.5,89 137,91Z"/>
        <!-- V-neckline -->
        <path style="fill:none;stroke:#A03060;stroke-width:1.2" d="M137,91 Q140,97 143,91"/>
        <!-- Waistband -->
        <rect style="fill:#901848;stroke:none" x="115" y="148" width="50" height="7"/>
      </g>

      <!-- ③ LEFT ARM -->
      <g id="h-larm" style="display:none">
        <!-- Short sleeve -->
        <path style="fill:#C23B6E;stroke:#A03060;stroke-width:0.5"
          d="M114,98 Q104,104 99,115 L106,119 Q111,108 116,106Z"/>
        <!-- Forearm skin -->
        <path style="fill:#F8C5A0;stroke:#D9A07A;stroke-width:0.5"
          d="M99,115 Q89,130 84,145 L91,148 Q96,134 106,119Z"/>
        <!-- Hand -->
        <ellipse style="fill:#F8C5A0;stroke:#D9A07A;stroke-width:0.5" cx="84" cy="149" rx="5.5" ry="4"/>
      </g>

      <!-- ④ RIGHT ARM -->
      <g id="h-rarm" style="display:none">
        <!-- Short sleeve -->
        <path style="fill:#C23B6E;stroke:#A03060;stroke-width:0.5"
          d="M166,98 Q176,104 181,115 L174,119 Q169,108 164,106Z"/>
        <!-- Forearm skin -->
        <path style="fill:#F8C5A0;stroke:#D9A07A;stroke-width:0.5"
          d="M181,115 Q191,130 193,143 L186,146 Q183,132 174,119Z"/>
        <!-- Hand -->
        <ellipse style="fill:#F8C5A0;stroke:#D9A07A;stroke-width:0.5" cx="193" cy="147" rx="5" ry="4"/>
      </g>

      <!-- ⑤ LEFT LEG -->
      <g id="h-lleg" style="display:none">
        <!-- Pant leg (purple) -->
        <path style="fill:#7B4F9E;stroke:#6B3F8E;stroke-width:0.5"
          d="M119,156 Q115,170 111,180 Q108,190 107,200 L120,200 Q120,191 122,181 Q124,171 127,158Z"/>
        <!-- Shoe -->
        <path style="fill:#2C1503;stroke:#1A0D02;stroke-width:0.5"
          d="M107,199 Q99,202 97,204 Q95,206 98,207 Q105,208 120,207 Q124,207 121,204 L121,199Z"/>
      </g>

      <!-- ⑥ RIGHT LEG -->
      <g id="h-rleg" style="display:none">
        <!-- Pant leg (purple) -->
        <path style="fill:#7B4F9E;stroke:#6B3F8E;stroke-width:0.5"
          d="M161,156 Q165,170 169,180 Q172,190 173,200 L160,200 Q160,191 158,181 Q156,171 153,158Z"/>
        <!-- Shoe -->
        <path style="fill:#2C1503;stroke:#1A0D02;stroke-width:0.5"
          d="M173,199 Q181,202 183,204 Q185,206 182,207 Q175,208 160,207 Q156,207 159,204 L159,199Z"/>
      </g>
    </svg>

    <div id="status"></div>
    <div id="hint"></div>
    <div id="word-display"></div>
    <div id="wrong-count">Wrong guesses: <span id="wrong-num">0</span> / 6</div>
    <div id="keyboard"></div>
    <div id="answer-reveal"></div>
    <button id="play-again" onclick="startGame()">Play Again</button>
  </div>

  <script>
    const WORDS = [
      { word: 'javascript',  hint: 'Programming language of the web' },
      { word: 'elephant',    hint: 'Largest land animal' },
      { word: 'galaxy',      hint: 'A vast system of stars in space' },
      { word: 'volcano',     hint: 'Mountain that erupts molten rock' },
      { word: 'keyboard',    hint: 'You type on this' },
      { word: 'pyramid',     hint: 'Ancient Egyptian monument' },
      { word: 'hurricane',   hint: 'A powerful tropical storm' },
      { word: 'chocolate',   hint: 'Sweet treat made from cacao' },
      { word: 'penguin',     hint: 'Flightless bird of the south pole' },
      { word: 'spaghetti',   hint: 'Long thin Italian pasta' },
      { word: 'umbrella',    hint: 'Protects you from rain' },
      { word: 'telescope',   hint: 'Used to observe distant stars' },
      { word: 'submarine',   hint: 'Vessel that travels underwater' },
      { word: 'democracy',   hint: 'Government by the people' },
      { word: 'saxophone',   hint: 'Woodwind instrument invented by Adolphe Sax' },
      { word: 'quicksand',   hint: 'Loose wet sand that sucks things in' },
      { word: 'avalanche',   hint: 'A mass of snow sliding down a mountain' },
      { word: 'labyrinth',   hint: 'A complex maze' },
      { word: 'blueprint',   hint: 'A detailed technical plan or drawing' },
      { word: 'algorithm',   hint: 'Step-by-step problem-solving procedure' },
    ];

    const PARTS = ['h-head','h-body','h-larm','h-rarm','h-lleg','h-rleg'];

    let word, guessed, wrong, gameOver;

    function startGame() {
      const entry = WORDS[Math.floor(Math.random() * WORDS.length)];
      word        = entry.word;
      guessed     = new Set();
      wrong       = 0;
      gameOver    = false;

      PARTS.forEach(id => document.getElementById(id).style.display = 'none');
      document.getElementById('h-eyes-x').style.display    = 'none';
      document.getElementById('h-win-smile').style.display = 'none';

      document.getElementById('status').textContent         = '';
      document.getElementById('status').className           = '';
      document.getElementById('hint').textContent           = `Hint: ${entry.hint}`;
      document.getElementById('answer-reveal').textContent  = '';
      document.getElementById('wrong-num').textContent      = '0';
      document.getElementById('play-again').style.display   = 'none';

      renderWord();
      renderKeyboard();
    }

    function renderWord() {
      const display = document.getElementById('word-display');
      display.innerHTML = '';
      for (const ch of word) {
        const slot = document.createElement('div');
        slot.className   = 'letter-slot';
        slot.textContent = guessed.has(ch) ? ch : '';
        display.appendChild(slot);
      }
    }

    function renderKeyboard() {
      const kb = document.getElementById('keyboard');
      kb.innerHTML = '';
      for (let c = 97; c <= 122; c++) {
        const letter = String.fromCharCode(c);
        const btn    = document.createElement('button');
        btn.className   = 'key';
        btn.textContent = letter;
        btn.id          = `key-${letter}`;
        btn.addEventListener('click', () => guess(letter));
        kb.appendChild(btn);
      }
    }

    function guess(letter) {
      if (gameOver || guessed.has(letter)) return;
      guessed.add(letter);
      const btn = document.getElementById(`key-${letter}`);
      btn.disabled = true;
      if (word.includes(letter)) {
        btn.classList.add('right');
        renderWord();
        checkWin();
      } else {
        btn.classList.add('wrong');
        document.getElementById(PARTS[wrong]).style.display = 'block';
        wrong++;
        document.getElementById('wrong-num').textContent = wrong;
        if (wrong >= 6) endGame(false);
      }
    }

    function checkWin() {
      if ([...word].every(ch => guessed.has(ch))) endGame(true);
    }

    function endGame(won) {
      gameOver = true;
      const statusEl = document.getElementById('status');
      statusEl.textContent = won ? 'You Win!' : 'Game Over!';
      statusEl.className   = won ? 'win' : 'lose';

      if (!won) {
        document.getElementById('answer-reveal').textContent = `The word was: ${word}`;
        const slots = document.getElementById('word-display').children;
        [...word].forEach((ch, i) => { slots[i].textContent = ch; });
      }

      if (won) {
        document.getElementById('h-win-smile').style.display = 'block';
      } else {
        document.getElementById('h-eyes-x').style.display = 'block';
      }

      document.querySelectorAll('.key').forEach(k => k.disabled = true);
      document.getElementById('play-again').style.display = 'inline-block';
    }

    document.addEventListener('keydown', e => {
      const letter = e.key.toLowerCase();
      if (/^[a-z]$/.test(letter)) guess(letter);
    });

    startGame();
  </script>
</body>
</html>
